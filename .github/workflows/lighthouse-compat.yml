name: Lighthouse Compatibility Check

on:
  push:
    branches:
      - tmp/lighthouse-compat-20260914

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency audit
        run: npm audit --audit-level=high

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run Lighthouse directly with visible errors
        shell: bash
        run: |
          CHROME_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")
          export CHROME_PATH
          node node_modules/http-server/bin/http-server -p 4173 -c-1 dist >/tmp/http-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/down/nav/index.html >/dev/null; then
              break
            fi
            sleep 0.25
          done
          ONLY=nav node scripts/lighthouse-audit.mjs
          cat logs/lighthouse-debug.log

      - name: Run repository performance threshold wrapper
        run: npm run test:perf
