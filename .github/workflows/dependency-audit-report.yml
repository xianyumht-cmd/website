name: Dependency Audit Report

on:
  push:
    branches:
      - tmp/dependency-audit-report-20260914

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Show vulnerable dependency chains
        shell: bash
        run: |
          npm ls basic-ftp axios vite rollup lighthouse @lhci/cli --all || true

      - name: Compare current audit with non-breaking npm audit fix
        shell: bash
        run: |
          set +e
          npm audit --json > audit-before.json
          BEFORE_EXIT=$?
          set -e

          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('audit-before.json', 'utf8'));
          console.log('AUDIT_BEFORE=' + JSON.stringify(report.metadata?.vulnerabilities || {}));
          NODE

          npm audit fix --package-lock-only --ignore-scripts || true

          set +e
          npm audit --json > audit-after.json
          AFTER_EXIT=$?
          set -e

          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('audit-after.json', 'utf8'));
          console.log('AUDIT_AFTER=' + JSON.stringify(report.metadata?.vulnerabilities || {}));
          const vulnerabilities = report.vulnerabilities || {};
          const rows = Object.entries(vulnerabilities)
            .map(([name, v]) => ({
              name,
              severity: v.severity,
              direct: Boolean(v.isDirect),
              range: v.range,
              effects: Array.isArray(v.effects) ? v.effects.join(',') : '',
              fix: v.fixAvailable === false ? 'none' : JSON.stringify(v.fixAvailable),
              via: Array.isArray(v.via) ? v.via.map(x => typeof x === 'string' ? x : `${x.source}:${x.title}`).join(' | ') : String(v.via)
            }))
            .sort((a, b) => {
              const rank = { critical: 0, high: 1, moderate: 2, low: 3, info: 4 };
              return (rank[a.severity] ?? 9) - (rank[b.severity] ?? 9) || Number(b.direct) - Number(a.direct) || a.name.localeCompare(b.name);
            });
          for (const r of rows) {
            console.log(`REMAINING|${r.severity}|${r.direct ? 'direct' : 'transitive'}|${r.name}|range=${r.range}|fix=${r.fix}|effects=${r.effects}|via=${r.via}`);
          }
          NODE

          echo "LOCKFILE_DIFF_START"
          git diff --stat -- package-lock.json
          echo "LOCKFILE_DIFF_END"
          exit $AFTER_EXIT
