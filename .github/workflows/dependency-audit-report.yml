name: Dependency Audit Report

on:
  push:
    branches:
      - tmp/dependency-audit-report-20260914

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Simulate final dependency remediation
        shell: bash
        run: |
          npm pkg delete devDependencies.@lhci/cli
          npm pkg set devDependencies.lighthouse='^13.4.1'
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true

          npm ls basic-ftp ws lighthouse @lhci/cli axios vite rollup --all || true

          set +e
          npm audit --json > audit-final.json
          AUDIT_EXIT=$?
          set -e

          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('audit-final.json', 'utf8'));
          console.log('SIMULATED_AUDIT=' + JSON.stringify(report.metadata?.vulnerabilities || {}));
          const vulnerabilities = report.vulnerabilities || {};
          for (const [name, v] of Object.entries(vulnerabilities)) {
            console.log(`SIM_REMAINING|${v.severity}|${v.isDirect ? 'direct' : 'transitive'}|${name}|range=${v.range}|fix=${JSON.stringify(v.fixAvailable)}|via=${JSON.stringify(v.via)}`);
          }
          NODE

          echo "PACKAGE_DIFF_START"
          git diff --stat -- package.json package-lock.json
          echo "PACKAGE_DIFF_END"
          exit $AUDIT_EXIT
