name: Lighthouse Final Verification

on:
  push:
    branches:
      - tmp/lighthouse-final5-20260914

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Lighthouse performance thresholds
        env:
          CHROME_PATH: /home/runner/.cache/ms-playwright/chromium-1208/chrome-linux64/chrome
        run: npm run test:perf
