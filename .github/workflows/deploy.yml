name: Deploy to GitHub Pages

on:
  push:
    branches:
      - source

  workflow_run:
    workflows:
      - Auto Update LOL Version
      - Auto Update Site Title (Yiyan)
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: source

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Smoke tests
        run: npm run test:smoke
        continue-on-error: true

      - name: Build project
        run: npm run build

      - name: Print build size report
        run: cat dist/build-size-report.json

      - name: Upload bundle reports
        uses: actions/upload-artifact@v4
        with:
          name: bundle-reports
          path: |
            dist/bundle-report.html
            dist/build-size-report.json
          if-no-files-found: warn

      - name: Deploy to main branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: main
          force_orphan: true
