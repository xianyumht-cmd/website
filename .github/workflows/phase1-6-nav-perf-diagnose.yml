name: Phase 1.6 NAV Performance Diagnose

on:
  push:
    branches:
      - tmp/phase1-6-nav-perf-diagnose-20260914

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start local server
        run: |
          npx http-server dist -p 4173 -c-1 > /tmp/nav-http.log 2>&1 &
          echo $! > /tmp/nav-http.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/down/nav/index.html >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/nav-http.log
          exit 1

      - name: Capture a high-CLS NAV run
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          node --input-type=module <<'NODE'
          import lighthouse from 'lighthouse';
          import * as chromeLauncher from 'chrome-launcher';

          const url = 'http://127.0.0.1:4173/down/nav/index.html';

          for (let run = 1; run <= 5; run += 1) {
            const chrome = await chromeLauncher.launch({
              chromePath: process.env.CHROME_PATH,
              chromeFlags: [
                '--headless=new',
                '--disable-gpu',
                '--no-first-run',
                '--no-default-browser-check',
                '--no-sandbox',
                '--disable-dev-shm-usage',
              ],
              logLevel: 'error',
            });

            try {
              const result = await lighthouse(url, {
                port: chrome.port,
                output: 'json',
                onlyCategories: ['performance'],
                logLevel: 'error',
              });
              const lhr = result.lhr;
              const audits = lhr.audits;
              const cls = audits['cumulative-layout-shift']?.numericValue ?? null;
              const relatedIds = Object.keys(audits).filter((id) => /cls|layout-shift/i.test(id));
              const related = Object.fromEntries(relatedIds.map((id) => [id, {
                title: audits[id]?.title,
                score: audits[id]?.score,
                displayValue: audits[id]?.displayValue,
                numericValue: audits[id]?.numericValue,
                details: audits[id]?.details,
              }]));
              console.log(`CLS_DIAG_RUN_${run}=${JSON.stringify({
                performanceScore: lhr.categories.performance.score,
                cls,
                related,
              })}`);
              if (typeof cls === 'number' && cls > 0.1) break;
            } finally {
              await chrome.kill();
            }
          }
          NODE

      - name: Stop local server
        if: always()
        run: |
          if [ -f /tmp/nav-http.pid ]; then
            kill "$(cat /tmp/nav-http.pid)" || true
          fi
