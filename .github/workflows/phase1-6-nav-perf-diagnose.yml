name: Phase 1.6 NAV Performance Diagnose

on:
  push:
    branches:
      - tmp/phase1-6-nav-perf-diagnose-20260914

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start local server
        run: |
          npx http-server dist -p 4173 -c-1 > /tmp/nav-http.log 2>&1 &
          echo $! > /tmp/nav-http.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/down/nav/index.html >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/nav-http.log
          exit 1

      - name: Trace mobile layout geometry and shifts
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';

          const browser = await chromium.launch({
            executablePath: process.env.CHROME_PATH,
            headless: true,
            args: ['--no-sandbox', '--disable-dev-shm-usage'],
          });
          const page = await browser.newPage({ viewport: { width: 412, height: 823 } });

          await page.addInitScript(() => {
            window.__layoutShifts = [];
            new PerformanceObserver((list) => {
              for (const entry of list.getEntries()) {
                if (entry.hadRecentInput) continue;
                window.__layoutShifts.push({
                  value: entry.value,
                  sources: (entry.sources || []).map((source) => ({
                    node: source.node?.outerHTML?.slice(0, 500) || source.node?.nodeName || null,
                    previousRect: source.previousRect,
                    currentRect: source.currentRect,
                  })),
                });
              }
            }).observe({ type: 'layout-shift', buffered: true });
          });

          const sample = async (label) => {
            const result = await page.evaluate((sampleLabel) => {
              const sidebar = document.querySelector('.sidebar-menu');
              const inner = document.querySelector('.sidebar-menu-inner');
              const logo = document.querySelector('.logo-env');
              const menu = document.querySelector('#main-menu');
              const main = document.querySelector('.main-content');
              const firstMenuItem = menu?.querySelector(':scope > li');
              const style = (el) => el ? getComputedStyle(el) : null;
              const rect = (el) => el ? el.getBoundingClientRect().toJSON() : null;
              const menuStyle = style(menu);
              return {
                label: sampleLabel,
                readyState: document.readyState,
                sidebar: rect(sidebar),
                inner: rect(inner),
                logo: rect(logo),
                menu: rect(menu),
                main: rect(main),
                firstMenuItem: rect(firstMenuItem),
                menuChildCount: menu?.children.length ?? null,
                menuComputed: menuStyle ? {
                  display: menuStyle.display,
                  flexDirection: menuStyle.flexDirection,
                  flexWrap: menuStyle.flexWrap,
                  minHeight: menuStyle.minHeight,
                  height: menuStyle.height,
                  overflowX: menuStyle.overflowX,
                  paddingTop: menuStyle.paddingTop,
                  paddingBottom: menuStyle.paddingBottom,
                } : null,
                sidebarComputed: sidebar ? {
                  display: style(sidebar).display,
                  position: style(sidebar).position,
                  height: style(sidebar).height,
                } : null,
                shifts: window.__layoutShifts,
              };
            }, label);
            console.log(`GEOMETRY_${label}=${JSON.stringify(result)}`);
          };

          await page.goto('http://127.0.0.1:4173/down/nav/index.html', { waitUntil: 'domcontentloaded' });
          await sample('DOMContentLoaded');
          await page.waitForTimeout(50);
          await sample('50ms');
          await page.waitForTimeout(250);
          await sample('300ms');
          await page.waitForTimeout(700);
          await sample('1000ms');
          await page.waitForTimeout(1000);
          await sample('2000ms');

          await browser.close();
          NODE

      - name: Stop local server
        if: always()
        run: |
          if [ -f /tmp/nav-http.pid ]; then
            kill "$(cat /tmp/nav-http.pid)" || true
          fi
