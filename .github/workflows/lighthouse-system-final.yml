name: Lighthouse System Chrome Verification

on:
  push:
    branches:
      - tmp/lighthouse-system-final-20260914

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Lighthouse performance thresholds
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:perf
