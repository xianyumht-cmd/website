
name: Baidu SEO Push

on:
  schedule:
    # Runs at 08:00 UTC (16:00 Beijing Time) every day
    # Adjust as needed, e.g., to run after deployment or content updates
    - cron: '0 8 * * *'
  workflow_dispatch:
  # Also run after deployment workflow completes (optional, needs coordination)
  # repository_dispatch:
  #   types: [deploy-success]

jobs:
  seo-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # Assuming axios/https are standard or in package.json. 
        # baidu-push.js uses 'https' (native) but if it used axios we'd need install.
        # It's safer to run install to match package-lock.
        run: npm ci

      - name: Run Baidu Push Script
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: node scripts/baidu-push.js
