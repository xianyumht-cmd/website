name: Temporary lockfile refresh for deployment recovery
on:
  push:
    branches:
      - fix/onekeyup-deploy-recovery-20261009

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Refresh non-breaking lockfile patches
        shell: bash
        run: |
          npm ci
          # A missing upstream security patch can leave audit fix nonzero.
          set +e
          npm audit fix --package-lock-only --ignore-scripts
          fix_status=$?
          set -e
          echo "npm audit fix status: ${fix_status}"
          git diff --check
          if ! git diff --quiet -- package.json; then
            echo "Refusing a package manifest change."
            exit 1
          fi
          if git diff --quiet -- package-lock.json; then
            echo "No compatible lockfile changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git commit -m "fix(deps): refresh compatible security patches"
          git push origin HEAD:refs/heads/fix/onekeyup-deploy-recovery-20261009
