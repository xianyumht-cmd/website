name: Update Data (No Deploy)

on:
  schedule:
    - cron: '0 * * * *'        # LOL version
    - cron: '0 0,8,16 * * *'   # title
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: source

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Update LOL Version
        env:
          LOL_API_KEY: ${{ secrets.LOL_API_KEY }}
        run: node scripts/update-lol-version.js

      - name: Update Site Title
        env:
          YIYAN_API_KEY: ${{ secrets.YIYAN_API_KEY }}
        run: node scripts/update-site-title.js

      - name: Commit data changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/*.json
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: update data"
            git push origin source
          fi
