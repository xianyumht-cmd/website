
name: Auto Update Site Title (Yiyan)

on:
  schedule:
    # Run 3 times a day: 00:00, 08:00, 16:00 UTC
    # (08:00, 16:00, 00:00 Beijing Time)
    - cron: '0 0,8,16 * * *'
  workflow_dispatch:

jobs:
  update-title:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch Yiyan and Update Config
        env:
          YIYAN_API_KEY: ${{ secrets.YIYAN_API_KEY }}
        run: node scripts/update-site-title.js

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/site-config.json
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update site title with new yiyan"
            git push origin source
          fi
