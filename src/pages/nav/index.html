<!DOCTYPE html>
<html lang="zh-CN" data-default-lang="zh-CN" data-baidu-analytics="201ec7af011a8e9dc6b1b66ddb73b4db">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Allow Referer to be sent to 51.la for localhost/IP access -->
    <meta name="referrer" content="no-referrer-when-downgrade">
    <title>脚本.top - 纯净 免费 简洁</title>

    <script type="module" src="../../../shared/responsive-base.js"></script>
    <script type="module" src="../../assets/js/theme-mode.min.js"></script>
    <script type="module" src="../../assets/js/language-switcher.min.js"></script>
    <script>
        (function() {
            try {
                var params = new URLSearchParams(location.search);
                if (params.has('perf')) {
                    var s = document.createElement('script');
                    s.src = '../../assets/js/performance-analyzer.min.js';
                    s.async = true;
                    document.head.appendChild(s);
                }
            } catch (e) {}
        })();
    </script>
    <script type="module" src="../../assets/js/error-guard.js"></script>
    <script type="module" src="../../../shared/page-guard.js"></script>
</head>

<body class="page-body nav-page">
    <script type="module" src="./entry.js"></script>
    <script type="module" src="./nav-visual.js"></script>

    <div class="page-container">
        <div class="fixed sidebar-menu toggle-others">
            <div class="sidebar-menu-inner">
                <header class="logo-env">
                    <div class="logo">
                        <a href="#navbar" aria-label="返回导航顶部">
                            <i class="fa-solid fa-compass"></i>
                        </a>
                        <div class="logo-text">
                            <a href="#navbar">脚本.top</a>
                        </div>
                    </div>
                    <div class="mobile-menu-toggle visible-xs">
                        <a onclick="themeMode.toggleMode()" title="切换主题模式">
                            <i class="fa-solid fa-circle-half-stroke theme-icon-element"></i>
                        </a>
                        <a href="" data-toggle="mobile-menu" aria-label="打开分类菜单">
                            <i class="fa-solid fa-bars"></i>
                        </a>
                    </div>
                </header>

                <ul class="main-menu" id="main-menu">
                    <!-- Menu items will be generated by JavaScript -->
                </ul>
            </div>
        </div>

        <main class="main-content">
            <nav class="navbar user-info-navbar nav-topbar" id="navbar" aria-label="页面工具">
                <div class="nav-topbar__primary">
                    <a class="nav-home-link" href="/#" target="_blank" rel="noopener noreferrer">
                        <i class="fa-solid fa-house" aria-hidden="true"></i>
                        <span>主站</span>
                    </a>
                    <div class="nav-runtime-meta" role="group" aria-label="站点状态">
                        <span class="nav-runtime-item">
                            <i class="fa fa-area-chart" aria-hidden="true"></i>
                            <span id="online_user_container"><span id="online_user">最近活跃访客 0</span></span>
                        </span>
                        <span class="nav-runtime-item">
                            <i class="fa fa-clock-o" aria-hidden="true"></i>
                            <span>更新时间</span>
                            <span id="sitetime"></span>
                        </span>
                    </div>
                </div>
                <div class="nav-clock box"></div>
            </nav>

            <header class="nav-directory-head">
                <h1>资源导航</h1>
                <p>按分类浏览，或直接搜索名称与说明。</p>
            </header>

            <section class="s-search nav-search-panel" id="search" aria-label="资源搜索">
                <div class="hide-type-list" id="search-list"></div>
                <div id="ss" class="nav-search-box">
                    <input type="search" autocomplete="off" id="search-text" onchange="txtSearch()" placeholder="输入关键词，筛选资源" style="outline: 0;">
                    <button type="button" aria-label="搜索" onclick="txtSearch()">
                        <i class="fa fa-search" aria-hidden="true"></i>
                    </button>
                </div>

                <div class="gg" id="gg">
                    <div class="notice" id="notice">
                        <i class="fa-solid fa-bullhorn" aria-hidden="true"></i>
                        <ul>
                            <li>页面将永久存在，失效请邮箱反馈</li>
                        </ul>
                    </div>
                </div>
            </section>

            <a class="white_content" id="light" onclick='document.getElementById("light").style.display="none"; document.getElementById("fade").style.display="none";'></a>
            <div class="black_overlay" onclick='document.getElementById("light").style.display="none"; document.getElementById("fade").style.display="none";' id="fade"></div>

            <div id="content-sections">
                <!-- Content will be generated by JavaScript from nav data -->
            </div>

            <div data-site-footer></div>
        </main>
    </div>

    <div class="fk_service">
        <ul>
            <li>
                <div class="fk_service_box fk_service_top" onclick="window.scrollTo({ top: 0, behavior: 'smooth' })" title="返回顶部">
                    <span style="margin-right: 8px; display: inline-flex; align-items: center;">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" width="18" height="18" fill="currentColor"><path d="M214.6 41.4c-12.5-12.5-32.8-12.5-45.3 0l-160 160c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L160 141.2V448c0 17.7 14.3 32 32 32s32-14.3 32-32V141.2L329.4 246.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3l-160-160z"/></svg>
                    </span>
                    <span class="fk_service_top_cont">返回顶部</span>
                </div>
            </li>
            <li>
                <div class="fk_service_box fk_service_ax" onclick="themeMode.toggleMode()" title="切换主题模式">
                    <span id="theme-icon" style="margin-right: 8px; display: inline-flex; align-items: center;">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="20" height="20" fill="currentColor"><path d="M448 256c0-106-86-192-192-192V448c106 0 192-86 192-192zM0 256a256 256 0 1 1 512 0A256 256 0 1 1 0 256z"/></svg>
                    </span>
                    <span id="theme-text" class="fk_service_ax_cont">自动模式</span>
                </div>
            </li>
            <li style="margin-top: 10px;">
                <div class="fk_service_box fk_service_bx" onclick="languageSwitcher.switchLanguage()" title="切换语言">
                    <span id="lang-icon" style="margin-right: 8px; display: inline-flex; align-items: center;">
                        <span class="nav-language-mark" aria-hidden="true">文</span>
                    </span>
                    <span id="lang-text" class="fk_service_bx_cont">Switch to English</span>
                </div>
            </li>
        </ul>
    </div>
</body>
</html>
