<!DOCTYPE html>
<html lang="zh-CN" data-default-lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Allow Referer to be sent to 51.la for localhost/IP access -->
    <meta name="referrer" content="no-referrer-when-downgrade">
    <title>游戏资源 - 脚本.top</title>
    
    <script type="module" src="./entry.js"></script>

    <script type="module" src="../../../shared/responsive-base.js"></script>
    
    
    <script type="module" src="../../assets/js/theme-mode.min.js"></script>
    <script type="module" src="../../assets/js/language-switcher.min.js"></script>
    <script type="module" src="../../assets/js/error-guard.js"></script>
    
</head>

<body class="page-body">
    
    <div class="page-container">
        <!-- Sidebar Menu -->
        <div class="fixed sidebar-menu toggle-others">
            <div class="sidebar-menu-inner">
                <header class="logo-env">
                    <div class="logo">
                        <a href="#navbar" aria-label="返回游戏资源顶部">
                            <i class="fa-solid fa-gamepad"></i>
                        </a>
                        <div class="logo-text">
                            <a href="#navbar" style="font-family: custom;">Games</a>
                        </div>
                    </div>
                    <div class="mobile-menu-toggle visible-xs">
                        <a onclick="themeMode.toggleMode()" title="切换主题模式">
                            <i id="theme-icon" class="fa-solid fa-circle-half-stroke theme-icon-element"></i>
                        </a>
                        <a href="" data-toggle="mobile-menu" aria-label="打开分类菜单">
                            <i class="fa-solid fa-bars"></i>
                        </a>
                    </div>
                </header>
                
                <ul class="main-menu" id="main-menu">
                    <!-- Menu items will be generated by JavaScript -->
                </ul>
            </div>
        </div>
        
        <!-- Main Content -->
        <div class="main-content">
            <!-- Navigation Bar -->
            <nav class="navbar user-info-navbar" id="navbar">
                <ul class="left-links list-inline list-unstyled user-info-menu">
                    <li class="menu-item">
                        <a href="../../../index.html" target="_blank" rel="noopener noreferrer">
                            <i class="fa-solid fa-house"></i>
                            <span>主站</span>
                        </a>
                        
                        <i class="fa fa-area-chart" style="margin-right: 6px; margin-left: 20px; margin-top: 2px;"></i>
                        <span>
                            <span id="online_user_container">
                                <span id="online_user">最近活跃访客 0</span>
                            </span>
                        </span>
                        
                        <i class="fa fa-clock-o" style="margin-right: 6px; margin-left: 20px; margin-top: 2px;"></i>
                        <span>更新时间：</span>
                        <span id="sitetime" style="color: red;"></span>
                    </li>
                    
                    <li class="menu-item" style="margin-left: auto; margin-right: 10px;">
                        <i class="fa fa-calendar-check" style="margin-right: 6px; margin-left: 26px; margin-top: 2px;"></i>
                        <span class="hitokoto" id="time"></span>
                        <div class="box"></div>
                    </li>
                </ul>
            </nav>
            
            <!-- Bulletin Box -->
            <div class="alert alert-primary" id="bulletin_box" role="alert">
                <div class="d-flex text-muted">
                    <div>
                        <i class="fa-solid fa-bullhorn"></i>
                    </div>
                    <div class="bulletin mx-1 mx-md-2">
                        <ul class="bulletin-ul" id="bulletin-content">
                            <!-- Bulletin content will be loaded from games-data.js -->
                        </ul>
                    </div>
                    <a href="javascript:;" rel="external nofollow" onclick='var b=document.getElementById("bulletin_box"); if(b){ b.style.display="none"; }' style="margin-left: auto;" title="关闭公告" aria-label="关闭公告">
                        <i class="fa-solid fa-xmark"></i>
                    </a>
                </div>
            </div>
            
            <!-- Search Section -->
            <div class="s-search" style="position: relative;" id="search">
                <div class="hide-type-list" id="search-list"></div>
                <div id="ss" style="position: relative; width: 60%;">
                    <input type="search" autocomplete="off" id="search-text" onchange="txtSearch()" placeholder=" 输入游戏名称搜索..." style="outline: 0;">
                    <button type="button" aria-label="搜索" onclick="txtSearch()">
                        <i class="fa fa-search"></i>
                    </button>
                </div>
                
                <div class="gg" id="gg">
                    <div class="notice" id="notice">
                        <div>
                            <i class="fa-solid fa-bullhorn" style="position: absolute; top: 1px; left: 1px; bottom: 1px; background: rgb(255,255,255,0); border: 0; font-size: 15px; margin: 8px; line-height: 20px; border-radius: 3px; transition: .3s;"></i>
                        </div>
                        <ul style="position: absolute; padding: 0 40px;">
                            <li>所有资源均来自互联网收集</li>
                        </ul>
                    </div>
                </div>
            </div>
            
            <a class="white_content" id="light" onclick='document.getElementById("light").style.display="none"; document.getElementById("fade").style.display="none";'></a>
            <div class="black_overlay" onclick='document.getElementById("light").style.display="none"; document.getElementById("fade").style.display="none";' id="fade"></div>
            
            <div id="content-sections">
                <!-- Content will be generated by JavaScript -->
            </div>

            
            <!-- Footer Disclaimer -->
            <div data-site-footer></div>
        </div>
    </div>
    
    <div class="fk_service">
        <ul>
            <li>
                <div class="fk_service_box fk_service_ax" onclick="themeMode.toggleMode()" title="切换主题模式">
                    <span class="theme-icon-element" style="margin-right: 8px; display: inline-flex; align-items: center;">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="20" height="20" fill="currentColor"><path d="M448 256c0-106-86-192-192-192V448c106 0 192-86 192-192zM0 256a256 256 0 1 1 512 0A256 256 0 1 1 0 256z"/></svg>
                    </span>
                    <span class="fk_service_ax_cont theme-text-element">自动模式</span>
                </div>
            </li>
            <li style="margin-top: 10px;">
                <div class="fk_service_box fk_service_bx" onclick="languageSwitcher.switchLanguage()" title="切换语言">
                    <span class="lang-icon-element" style="margin-right: 8px; display: inline-flex; align-items: center;">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512" width="20" height="20" fill="currentColor"><path d="M352 256c0 22.2-1.2 43.6-3.3 64H163.3c-2.2-20.4-3.3-41.8-3.3-64s1.2-43.6 3.3-64h185.4c2.2 20.4 3.3 41.8 3.3 64zm28.8-64h123.1c5.3 20.5 8.1 41.9 8.1 64s-2.8 43.5-8.1 64H380.8c2.1-20.6 3.2-42 3.2-64s-1.1-43.4-3.2-64zm112.6-32H376.7c-10-63.9-29.8-117.4-55.3-151.6 78.3 20.7 142 77.5 171.9 151.6zm-149.1 0H167.7c6.1-36.4 15.5-68.6 27-94.7 10.5-23.6 22.2-40.7 33.5-51.5C238.9 78.7 258.9 64 280 64c21.1 0 41.1 14.7 51.8 29.8 11.3 10.8 23 27.9 33.5 51.5 11.6 26 20.9 58.2 27 94.7zm-209 0H18.6c30-74.1 93.6-130.9 172-151.6-25.5 34.2-45.2 87.7-55.3 151.6zM8.1 192h123.1c-2.1 20.6-3.2 42-3.2 64s1.1 43.4 3.2 64H8.1C2.8 299.5 0 278.1 0 256s2.8-43.5 8.1-64zm186.6 254.6c-11.6-26-20.9-58.2-27-94.6h176.6c-6.1 36.4-15.5 68.6-27 94.6-10.5 23.6-22.2 40.7-33.5 51.5-10.7 15-30.7 29.8-51.8 29.8-21.1 0-41.1-14.7-51.8-29.8-11.3-10.8-23-27.9-33.5-51.5zM135.3 352c10 63.9 29.8 117.4 55.3 151.6-78.4-20.7-142-77.5-172-151.6h116.7zm358.1 0c-30 74.1-93.6 130.9-171.9 151.6 25.5-34.2 45.2-87.7 55.3-151.6h116.6z"/></svg>
                    </span>
                    <span class="fk_service_bx_cont lang-text-element">Switch to English</span>
                </div>
            </li>
        </ul>
    </div>
</body>
</html>
